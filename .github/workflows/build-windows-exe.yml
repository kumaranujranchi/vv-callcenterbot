name: Build Windows .exe for 500 Agents

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual 1-click trigger to generate .exe

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Installer (.exe)
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Installer File
        shell: bash
        run: |
          mkdir -p dist/setup
          find dist -maxdepth 1 -name "*.exe" -exec cp {} dist/setup/CallCenterCopilot-Setup.exe \;
          ls -lh dist/setup/

      - name: Upload Windows Installer as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallCenterCopilot-Windows-Setup
          path: dist/setup/CallCenterCopilot-Setup.exe
